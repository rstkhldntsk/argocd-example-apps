apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-dashboard
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kubernetes.github.io/dashboard/
      chart: kubernetes-dashboard
      targetRevision: 7.13.0
      helm:
        valueFiles:
          - $values/k8s-dashboard/values.yaml
    - repoURL: https://github.com/rstkhldntsk/argocd-example-apps.git
      targetRevision: HEAD
      ref: values
      path: k8s-dashboard/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: k8s-dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
